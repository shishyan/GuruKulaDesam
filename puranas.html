<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>புராண இதிகாச கதைப் பெருநூலகம் | Guru Kula Desam Subsite</title>
  <meta name="description" content="108 குழந்தைகள் புராண இதிகாசக் கதைகள் மற்றும் 24 மூலப் பெருநூல்களின் தூய வாசிப்பு அரங்கம்.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pure-book-reader.css?v=4.0">
</head>
<body class="library-subsite">

  <!-- DEDICATED DIGITAL LIBRARY SUBSITE HEADER -->
  <header class="library-subsite-header">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="library-btn" title="முதன்மைப் பள்ளிக்குத் திரும்பு">
        <span>&larr;</span>
        <span>பள்ளி முகப்பு</span>
      </a>
      <div class="library-brand-block">
        <div class="library-brand-badge">
          <span>📖</span>
          <span>ஆசிரம நூலக அரங்கம்</span>
        </div>
        <div>
          <div class="library-subsite-title" id="currentBookBadge">குழந்தைகளுக்கான 108 புராண இதிகாசக் கதைகள்</div>
          <div class="library-subsite-subtitle">Digital Vedic Children Storybook Subsite</div>
        </div>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="library-header-actions">
      <button type="button" class="library-btn library-btn-gold" onclick="openBooksDrawer()">
        <span>📚</span>
        <span>24 பெருநூல்கள் பட்டியல்</span>
      </button>
      <a href="who-we-are.html" class="library-btn">
        <span>🔱</span>
        <span>வம்சாவளி</span>
      </a>
    </div>
  </header>

  <!-- SUBSITE OFFCANVAS DRAWER FOR 24 BOOKS -->
  <div class="books-drawer-overlay" id="booksDrawerOverlay" onclick="closeBooksDrawer()">
    <div class="books-sliding-drawer" onclick="event.stopPropagation()">
      <div class="books-drawer-header">
        <div style="font-weight:800; font-size:1.15rem; color:var(--gold-bright, #ffd700); display:flex; align-items:center; gap:8px;">
          <span>📚</span> 24 மூலப் பெருநூல்கள்
        </div>
        <button type="button" onclick="closeBooksDrawer()" style="background:transparent; border:none; color:#cbd5e1; font-size:1.6rem; cursor:pointer;">&times;</button>
      </div>
      <div style="padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <input type="text" oninput="filterPuranaList(this)" placeholder="நூல்களைத் தேடுக... (Search Puranas)" style="width:100%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:10px 14px; color:#ffffff; font-size:0.92rem; outline:none;">
      </div>
      <div class="books-drawer-body" id="puranaBookList">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- CENTERED READING WORKSPACE -->
  <main class="library-reading-container">
    
    <!-- Top Chapter Bar -->
    <div class="story-chapter-bar">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="color:var(--gold-soft, #ffd700); font-weight:800; font-size:0.95rem;">கதைத் தேர்வு:</span>
        <select id="chapterSelectDropdown" class="story-select-dropdown" onchange="window.switchPuranaChapter(parseInt(this.value, 10))">
          <!-- Loaded dynamically -->
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="library-btn" onclick="window.prevChapterQuick()">&larr; முந்தைய கதை</button>
        <button type="button" class="library-btn library-btn-gold" onclick="window.nextChapterQuick()">அடுத்த கதை &rarr;</button>
      </div>
    </div>

    <!-- Reading Canvas (Parchment Paper Book Layout with 2 Images) -->
    <div id="puranaReadingArea">
      <!-- Injected dynamically by purana-reader.js -->
    </div>

  </main>

  <script src="assets/js/purana-reader.js?v=4.0"></script>
  <script>
    function openBooksDrawer() {
      document.getElementById('booksDrawerOverlay').classList.add('open');
    }
    function closeBooksDrawer() {
      document.getElementById('booksDrawerOverlay').classList.remove('open');
    }
  </script>
</body>
</html>
