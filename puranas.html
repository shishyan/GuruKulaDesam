<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pure-book-reader.css?v=2.0">

<body class="has-left-strip purana-reader-body">

  <!-- LEFT STRIP BAR (GLOBAL SHELL) -->
  <aside class="left-strip-bar" id="leftStripBar" aria-label="குருகுல முதன்மைப் பட்டி">
    <div class="strip-header">
      <a href="index.html" class="strip-brand-link" title="குரு குல ஆசிரமம்">
        <span class="strip-emblem"><svg class="gkd-icon gkd-om-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 10.5c-.3-.7-.2-1.5.3-2.1.8-.9 2.2-.9 3 .1.4.5.5 1.2.2 1.8-.4.7-1.1 1.2-1.7 1.7.9.3 1.7.9 2 1.7.4 1.1 0 2.4-1 3.1-1.2.9-2.9.7-3.9-.4-.4-.5-.6-1.1-.6-1.7h1.4c0 .4.2.8.5 1 .6.5 1.5.4 2-.1.4-.4.5-1 .2-1.5-.4-.7-1.2-1-2-1v-1.2c.6 0 1.2-.2 1.5-.7.3-.4.3-.9 0-1.3-.4-.5-1.1-.6-1.6-.2-.3.2-.5.6-.5 1H8.2zm6.3-2.5c.8 0 1.5.5 1.8 1.2l-1.2.5c-.2-.4-.5-.6-.8-.6-.6 0-1 .4-1 1s.4 1 1 1c.5 0 .9-.3 1.1-.7l1.1.6c-.4.8-1.2 1.3-2.2 1.3-1.4 0-2.4-1-2.4-2.4 0-1.3 1-2.4 2.4-2.4zm1.5-1.5c.3 0 .5.2.5.5s-.2.5-.5.5-.5-.2-.5-.5.2-.5.5-.5z"/></svg></span>
        <div style="display: flex; flex-direction: column;">
          <span class="strip-brand-text">குரு குல ஆசிரமம்</span>
          <span style="font-size: 0.68rem; color: #2dd4bf; letter-spacing: 0.05em; font-weight: 600;">108 புராணக் கதைகள்</span>
        </div>
      </a>
      <button type="button" class="strip-toggle-btn" id="stripToggleBtn" onclick="togglePrimaryMenu()" data-tooltip="பட்டி விரிவாக்குக / சுருக்குக" title="முதன்மைப் பட்டி" aria-label="பட்டி மாற்றுக">
        <span class="strip-toggle-icon"><svg class="gkd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
      </button>
    </div>

    <nav class="strip-nav-list" id="stripNavList">
      <div class="strip-group" data-group="home">
        <a href="index.html" class="strip-item" data-tooltip="பாடத்திட்ட முகப்பு">
          <span class="strip-item-icon"><svg class="gkd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v3"/><path d="M7 5h10l-1.5 4H8.5L7 5z"/><path d="M5 9h14l-1.5 5H6.5L5 9z"/><path d="M3 14h18v7H3v-7z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/></svg></span>
          <span class="strip-item-label">பாடத்திட்ட முகப்பு</span>
        </a>
      </div>
      <div class="strip-group" data-group="who_we_are">
        <a href="who-we-are.html" class="strip-item" data-tooltip="யார் நாம்? (Who We Are)">
          <span class="strip-item-icon"><svg class="gkd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span class="strip-item-label">யார் நாம்? (வம்சாவளி)</span>
        </a>
      </div>
      <div class="strip-group" data-group="puranas_active">
        <a href="puranas.html" class="strip-item active" data-tooltip="108 புராண இதிகாசக் கதைகள்">
          <span class="strip-item-icon"><svg class="gkd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="strip-item-label">108 புராணக் கதைகள்</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- SLIDING DRAWER FOR 24 LIBRARY BOOKS -->
  <div class="books-drawer-overlay" id="booksDrawerOverlay" onclick="closeBooksDrawer()">
    <div class="books-sliding-drawer" onclick="event.stopPropagation()">
      <div class="books-drawer-header">
        <div style="font-weight:800; font-size:1.1rem; color:var(--gold-bright, #ffd700);">
          📚 கதை நூலகம் (24 பெருநூல்கள்)
        </div>
        <button type="button" onclick="closeBooksDrawer()" style="background:transparent; border:none; color:#cbd5e1; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div style="padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <input type="text" oninput="filterPuranaList(this)" placeholder="நூல்களைத் தேடுக... (Search)" style="width:100%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:8px 12px; color:#ffffff; font-size:0.9rem; outline:none;">
      </div>
      <div class="books-drawer-body" id="puranaBookList">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- CENTERED BOOK READING WORKSPACE -->
  <main class="purana-page-wrap">
    
    <!-- Top Compact Navigation Bar -->
    <header class="book-reader-topbar">
      <button type="button" class="book-library-trigger-btn" onclick="openBooksDrawer()">
        <span>📚</span>
        <span id="currentBookBadge">குழந்தைகளுக்கான 108 கதைகள்</span>
        <span style="font-size:0.75rem; opacity:0.8;">▼</span>
      </button>

      <div style="display:flex; align-items:center; gap:10px;">
        <select id="chapterSelectDropdown" class="book-chapter-dropdown" onchange="window.switchPuranaChapter(parseInt(this.value, 10))">
          <!-- Loaded dynamically -->
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="book-turn-btn" onclick="window.prevChapterQuick()" style="padding:7px 14px; font-size:0.88rem;">&larr; முந்தைய</button>
        <button type="button" class="book-turn-btn book-turn-btn-next" onclick="window.nextChapterQuick()" style="padding:7px 14px; font-size:0.88rem;">அடுத்தது &rarr;</button>
      </div>
    </header>

    <!-- Reading Canvas (Parchment Paper Book Layout) -->
    <div id="puranaReadingArea">
      <!-- Injected dynamically by purana-reader.js -->
    </div>

  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/purana-reader.js?v=3.0"></script>
  <script>
    function openBooksDrawer() {
      document.getElementById('booksDrawerOverlay').classList.add('open');
    }
    function closeBooksDrawer() {
      document.getElementById('booksDrawerOverlay').classList.remove('open');
    }
  </script>
</body>
</html>
