<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; background: #090d16; color: #f8fafc; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #c084fc; display: flex; justify-content: space-between; }
  p.sub { margin: 0 0 12px; font-size: 11px; color: #94a3b8; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
  button { width: 100%; background: #9333ea; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  button.sec { background: #1e293b; border: 1px solid #475569; }
</style>
</head>
<body>
  <h2><span>🌙 DarkZen</span><span style="font-size:11px;color:#d8b4fe;">OLED + Reader</span></h2>
  <p class="sub">Free Dark Reader Pro & Helperbird Alternative • Smart Dark Theme & Zen Mode</p>
  <div class="row">
    <span>Contrast (<span id="cVal">100</span>%)</span>
    <input type="range" id="contrast" min="80" max="130" value="100">
  </div>
  <div class="row">
    <span>Warmth / Blue-Light (<span id="sVal">10</span>%)</span>
    <input type="range" id="sepia" min="0" max="60" value="10">
  </div>
  <button id="toggleDark">Toggle OLED Dark Mode on Tab</button>
  <button id="readerBtn" class="sec">Open Distraction-Free Zen Reader</button>
  <script src="popup.js"></script>
</body>
</html>
