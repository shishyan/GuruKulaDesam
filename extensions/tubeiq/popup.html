<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TubeIQ — Free YouTube SEO & Outlier Toolkit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px;
      min-height: 480px;
      background: #0f172a;
      color: #f8fafc;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 17px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 9px 12px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      background: linear-gradient(135deg, #0284c7 0%, #10b981 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .scores {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .score-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .score-val {
      font-size: 18px;
      font-weight: 800;
      color: #10b981;
    }
    .score-lbl {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .table-wrap {
      max-height: 255px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
      font-size: 10px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }
    .kw-row:hover {
      background: rgba(56, 189, 248, 0.08);
      cursor: pointer;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">⚡ TubeIQ Keyword Explorer</div>
    <span class="badge">FREE FOREVER</span>
  </div>

  <div class="search-box">
    <input id="kw-input" type="text" placeholder="Enter topic (e.g. திருப்புகழ், YouTube Shorts)..." value="Thirukkural" />
    <button id="search-btn">Explore</button>
  </div>

  <div class="scores">
    <div class="score-card">
      <div id="overall-score" class="score-val">--</div>
      <div class="score-lbl">Overall Score</div>
    </div>
    <div class="score-card">
      <div id="demand-score" class="score-val" style="color:#38bdf8">--</div>
      <div class="score-lbl">Search Demand</div>
    </div>
    <div class="score-card">
      <div id="comp-score" class="score-val" style="color:#f59e0b">--</div>
      <div class="score-lbl">Competition</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Keyword (Click to Copy)</th>
          <th>Vol</th>
          <th>Comp</th>
          <th>Opp</th>
        </tr>
      </thead>
      <tbody id="kw-tbody">
        <tr><td colspan="4" style="text-align:center;color:#94a3b8;">Click Explore to fetch live YouTube keywords...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-actions">
    <span id="status-msg" class="hint">Active on YouTube Feed & Watch Pages</span>
    <button id="copy-all-btn">Copy Top 15 Tags</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
