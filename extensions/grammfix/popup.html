<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 350px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 6px; font-size: 16px; color: #10b981; display: flex; justify-content: space-between; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  textarea { width: 100%; height: 110px; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; padding: 8px; font-size: 12px; resize: vertical; }
  .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button { flex: 1; background: #10b981; color: #052e16; border: none; padding: 7px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.sec { background: #334155; color: #e2e8f0; }
  #stats { margin-top: 10px; font-size: 11px; color: #cbd5e1; background: #1e293b; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
  <h2><span>GrammFix Pro</span><span style="font-size:11px;color:#34d399;">100% Free</span></h2>
  <p class="sub">Free Grammarly + Wordtune Alternative • Grammar, Conciseness & Tone</p>
  <textarea id="input" placeholder="Paste or type any sentence, email, or paragraph to proofread & rewrite..."></textarea>
  <div class="btns">
    <button id="checkBtn">Fix Grammar</button>
    <button id="conciseBtn" class="sec">Make Concise</button>
    <button id="formalBtn" class="sec">Executive Tone</button>
  </div>
  <div id="stats">Ready — Type above or click inside any webpage input field.</div>
  <script src="popup.js"></script>
</body>
</html>
