<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 350px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #fb7185; display: flex; justify-content: space-between; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 8px; font-size: 11px; font-family: monospace; }
  button { width: 100%; background: #f43f5e; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-bottom: 6px; }
  button.sec { background: #334155; }
  img { width: 100%; border-radius: 6px; margin-top: 6px; display: none; border: 1px solid #475569; }
</style>
</head>
<body>
  <h2><span>🐞 SnapBug</span><span style="font-size:11px;color:#fda4af;">Dev & QA Suite</span></h2>
  <p class="sub">Free Usersnap, GoFullPage & CSS Peeper Alternative</p>
  <div id="meta" class="card">Collecting viewport & console telemetry...</div>
  <button id="snapBtn">📸 Capture HD Screenshot (Download PNG)</button>
  <button id="inspectBtn" class="sec">🔍 Toggle Live CSS & Box-Model Inspector</button>
  <button id="copyBugBtn" class="sec">📋 Copy Markdown QA Bug Report</button>
  <img id="preview" alt="Screenshot preview">
  <script src="popup.js"></script>
</body>
</html>
