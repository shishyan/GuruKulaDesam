<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 350px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #2dd4bf; display: flex; justify-content: space-between; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .pw-box { background: #1e293b; border: 1px solid #14b8a6; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; word-break: break-all; text-align: center; color: #5eead4; margin-bottom: 8px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button { flex: 1; background: #14b8a6; color: #042f2e; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; }
  button.sec { background: #334155; color: #e2e8f0; }
  input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 7px; border-radius: 6px; font-size: 11px; margin-bottom: 6px; }
</style>
</head>
<body>
  <h2><span>🔐 DashVault</span><span style="font-size:11px;color:#5eead4;">Zero-Cloud AES</span></h2>
  <p class="sub">Free 1Password & Dashlane Alternative • Cryptographic Generator & Local Vault</p>
  <div id="pwOut" class="pw-box">Generating 24-char cryptographic key...</div>
  <div class="row">
    <button id="genBtn">🎲 Regenerate (24c)</button>
    <button id="copyBtn" class="sec">📋 Copy</button>
    <button id="fillBtn" class="sec">⚡ Auto-Fill Tab</button>
  </div>
  <input id="breachInput" placeholder="Enter password to check HIBP k-Anonymity breach count...">
  <button id="breachBtn" class="sec" style="width:100%;">🛡️ Check Password Breach Exposure (SHA-1 Prefix Only)</button>
  <div id="breachOut" style="font-size:11px;color:#cbd5e1;margin-top:6px;">100% private: only first 5 SHA-1 hex chars leave your browser.</div>
  <script src="popup.js"></script>
</body>
</html>
