<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 350px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #eab308; display: flex; justify-content: space-between; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 8px; font-size: 12px; }
  .code { display: inline-block; background: #ca8a04; color: #fff; padding: 3px 7px; border-radius: 4px; margin: 2px; font-family: monospace; font-weight: 700; cursor: pointer; font-size: 11px; }
  button { width: 100%; background: #eab308; color: #422006; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🏷️ KeepPrice</span><span style="font-size:11px;color:#fde047;">Zero Tracking</span></h2>
  <p class="sub">Free Keepa & Honey Pro Alternative • Price Watchlist & Coupon Tester</p>
  <div id="info" class="card">Scanning product prices on active tab...</div>
  <div id="coupons" class="card">Universal Promo Codes (Click to copy):</div>
  <button id="trackBtn">Save Product to Price Drop Watchlist</button>
  <script src="popup.js"></script>
</body>
</html>
