name: South Indian 1008 Recipes Batch Publisher (@TamilDailyLife)

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of recipe posts per batch'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: south-indian-recipes-1008-batches
  cancel-in-progress: false

jobs:
  publish-recipes-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rclone & Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          python -m pip install --upgrade pip
          pip install -q playwright
          playwright install chromium

      - name: Restore rclone Google Drive Config
        env:
          GURUKULADESAM_RCLONE_CONF: ${{ secrets.GURUKULADESAM_RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$GURUKULADESAM_RCLONE_CONF" ]; then
            printf "%s" "$GURUKULADESAM_RCLONE_CONF" > ~/.config/rclone/rclone.conf
          fi

      - name: Sync 1008 Recipes & Receipts from Google Drive
        run: |
          mkdir -p /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008
          rclone copy gdrive:GuruKulaDesam/Assets/south-indian-recipes-1008 /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008 --transfers 8 || true

      - name: Generate 1008 Recipes if Index Missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008/RECIPES_1008_INDEX.json ]; then
            python tools/generate_1008_south_indian_recipes.py
            rclone copy /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008 gdrive:GuruKulaDesam/Assets/south-indian-recipes-1008 --transfers 8
          fi

      - name: Publish Next Batch of 10 South Indian Recipes
        env:
          YT_STORAGE_STATE_JSON: ${{ secrets.YT_STORAGE_STATE_JSON }}
        run: |
          python tools/publish_1008_recipes_batches.py --batch-size "${{ github.event.inputs.batch_size || '10' }}"

      - name: Sync Updated Receipts Back to Google Drive
        if: always()
        run: |
          if [ -f /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008/published_recipes_batches.json ]; then
            rclone copy /home/runner/GoogleDrive_GuruKulaDesam/Assets/south-indian-recipes-1008/published_recipes_batches.json gdrive:GuruKulaDesam/Assets/south-indian-recipes-1008/
          fi
