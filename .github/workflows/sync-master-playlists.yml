name: Sync All Videos & Shorts to Master Playlists

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  sync_playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore Flagship OAuth Token
        env:
          GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN: ${{ secrets.GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN }}
        run: |
          mkdir -p data/credentials
          if [ -n "$GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN" ]; then
            printf "%s" "$GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN" > data/credentials/token.json
          fi

      - name: Execute Playlist Sync
        env:
          GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN: ${{ secrets.GURU_KULA_DESAM_FLAGSHIP_OAUTH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python tools/sync_all_to_master_playlists.py --dry-run
          else
            python tools/sync_all_to_master_playlists.py --live
          fi

      - name: Commit & Push Updated Master Playlist Plan & Logs
        run: |
          git config --global user.name "Guru Kula Desam Bot"
          git config --global user.email "bot@gurukuladesam.org"
          if [ -f production/master_playlist_sync_plan.json ]; then
            git add production/master_playlist_sync_plan.json
            if [ -n "$(git status --porcelain production/master_playlist_sync_plan.json)" ]; then
              git commit -m "chore(playlists): update master playlist sync plan [skip ci]"
              git push origin master || git push origin main || true
            fi
          fi
