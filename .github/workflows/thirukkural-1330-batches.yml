name: Thirukkural 1330 Categorized Batch Publisher (@Guru-Kula-Desam)

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of Adhikaram posts per batch'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: thirukkural-1330-batches
  cancel-in-progress: false

jobs:
  publish-thirukkural-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rclone & Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          python -m pip install --upgrade pip
          pip install -q playwright
          playwright install chromium

      - name: Restore rclone Google Drive Config
        env:
          GURUKULADESAM_RCLONE_CONF: ${{ secrets.GURUKULADESAM_RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$GURUKULADESAM_RCLONE_CONF" ]; then
            printf "%s" "$GURUKULADESAM_RCLONE_CONF" > ~/.config/rclone/rclone.conf
          fi

      - name: Sync Categorized Thirukkural Posts & Receipts from Google Drive
        run: |
          mkdir -p /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-1330-categorized
          mkdir -p /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-133-posts
          rclone copy gdrive:GuruKulaDesam/Assets/thirukkural-1330-categorized /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-1330-categorized --transfers 8
          rclone copy gdrive:GuruKulaDesam/Assets/thirukkural-133-posts /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-133-posts --include "*.jpg" --transfers 8

      - name: Publish Next Batch of 5 Thirukkural Adhikaram Posts
        env:
          YT_STORAGE_STATE_JSON: ${{ secrets.YT_STORAGE_STATE_JSON }}
        run: |
          python tools/publish_133_thirukkural_categorized_batches.py --batch-size "${{ github.event.inputs.batch_size || '5' }}"

      - name: Sync Updated Receipts Back to Google Drive
        if: always()
        run: |
          if [ -f /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-1330-categorized/published_batches.json ]; then
            rclone copy /home/runner/GoogleDrive_GuruKulaDesam/Assets/thirukkural-1330-categorized/published_batches.json gdrive:GuruKulaDesam/Assets/thirukkural-1330-categorized/
          fi
