name: TamilDailyLife Daily Panchangam Episode

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST daily
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD), leave empty for today'
        required: false
        default: ''

jobs:
  build-daily-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Tamil fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-taml
          pip install -q edge-tts pillow librosa numpy

      - name: Generate daily script, narration & 1080p lyrical-style video
        run: |
          python tools/tamildailylife_daily_builder.py --date "${{ github.event.inputs.target_date }}"

      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tamildailylife-daily-episode
          path: |
            out/tamildailylife_*.md
            out/tamildailylife_*.mp4
          retention-days: 7
