<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>குரு குல தேசம் (Guru Kula Desam) — Media Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: rgba(26, 29, 36, 0.7);
      --card-border: rgba(212, 175, 55, 0.2);
      --card-hover: rgba(212, 175, 55, 0.35);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f0f2f5;
      --text-muted: #9aa0a6;
      --badge-film: #e63946;
      --badge-audio: #2a9d8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Mukta Malar', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 30px 10px;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }

    .header h1 {
      font-size: 2.2rem;
      color: var(--gold-light);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Player Container */
    .player-container {
      max-width: 900px;
      margin: 0 auto 30px auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
    }

    .player-container.active {
      display: block;
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-meta {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14171d;
    }

    .player-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-light);
    }

    .close-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Controls */
    .controls {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tab-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      border-color: var(--gold);
    }

    .tab-btn.active {
      background: var(--gold);
      color: #121316;
      border-color: var(--gold);
      font-weight: 600;
    }

    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .search-input {
      flex: 1;
      max-width: 450px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .type-filters {
      display: flex;
      gap: 6px;
    }

    .type-btn {
      padding: 6px 12px;
      border-radius: 15px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .type-btn.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .stats-bar {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Grid */
    .media-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .media-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #1a1a1a;
      overflow: hidden;
    }

    .thumb-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .media-card:hover .thumb-wrapper img {
      transform: scale(1.05);
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
    }

    .badge-film { background: var(--badge-film); }
    .badge-audio { background: var(--badge-audio); }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.65);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .media-card:hover .play-overlay {
      opacity: 1;
    }

    .card-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>

    let currentCategory = 'all';
    let currentType = 'all';
    let searchQuery = '';

    function getItems() {
      let items = [];
      if (currentCategory === 'all') {
        for (let cat in CATALOG) {
          items = items.concat(CATALOG[cat]);
        }
      } else {
        items = CATALOG[currentCategory] || [];
      }

      return items.filter(it => {
        if (currentType !== 'all' && it.type !== currentType) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return it.title.toLowerCase().includes(q) || it.id.includes(q);
        }
        return true;
      });
    }

    function renderGrid() {
      const items = getItems();
      const grid = document.getElementById('mediaGrid');
      const stats = document.getElementById('statsBar');

          <div class="card-info">
            <div class="card-title">${it.title}</div>
            <div class="card-meta">
              <span>${it.type === 'film' ? '🎬 Full Film' : '🎵 Official Release'}</span>
              <span>Watch on YouTube ↗</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(cat)) {
          btn.classList.add('active');
        }
      });
      renderGrid();
    }

    function setTypeFilter(t) {
      currentType = t;
      document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
      if (t === 'all') document.getElementById('typeAll').classList.add('active');
      if (t === 'film') document.getElementById('typeFilm').classList.add('active');
      if (t === 'audio') document.getElementById('typeAudio').classList.add('active');
      renderGrid();
    }

    function filterMedia() {
      searchQuery = document.getElementById('searchInput').value;
      renderGrid();
    }

    function playVideo(id, title) {
      const container = document.getElementById('playerContainer');
      const iframe = document.getElementById('videoIframe');
      const titleElem = document.getElementById('playerTitle');
      
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
      titleElem.innerText = title;
      container.classList.add('active');
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closePlayer() {
      const container = document.getElementById('playerContainer');
      const iframe = document.getElementById('videoIframe');
      iframe.src = '';
      container.classList.remove('active');
    }

    // Initial render
    renderGrid();
  </script>
</body>
</html>
